apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
  namespace: civicpulse
type: Opaque
stringData:
  # ──────────────────────────────────────────────────────────
  # PLACEHOLDER VALUES — Replace before deploying to any cluster.
  # In production, use a sealed-secret controller, external-secrets,
  # or inject via CI/CD pipeline variables.
  # ──────────────────────────────────────────────────────────
  POSTGRES_USER: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "CHANGE_ME"
  DATABASE_URL: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@postgres-svc:5432/CHANGE_ME"
  SYNC_DATABASE_URL: "postgresql://CHANGE_ME:CHANGE_ME@postgres-svc:5432/CHANGE_ME"
  REDIS_URL: "redis://redis-svc:6379/0"
  GROQ_API_KEY: ""
