# docker-compose.prod.yaml — Production overrides
#
# Usage:
#   IMAGE_TAG=<commit-sha> docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
#
# IMAGE_TAG is REQUIRED — never defaults to 'latest' in production.

services:
  # ── PostgreSQL — no exposed ports in production ────────
  postgres:
    ports: !override []

  # ── Redis — no exposed ports in production ─────────────
  redis:
    ports: !override []

  # ── Ollama — no exposed ports in production ────────────
  ollama:
    ports: !override []

  # ── Backend — pre-built image, no bind mounts, no host ports
  backend:
    image: ${REGISTRY:-ghcr.io/civicpulse}/backend:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA}
    build: !reset null
    restart: always
    ports: !override []
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: WARNING

  # ── Migrations — same pre-built backend image ──────────
  migrations:
    image: ${REGISTRY:-ghcr.io/civicpulse}/backend:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA}
    build: !reset null

  # ── Frontend — pre-built image, published only on port 80
  frontend:
    image: ${REGISTRY:-ghcr.io/civicpulse}/frontend:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA}
    build: !reset null
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    ports: !override
      - "80:80"
