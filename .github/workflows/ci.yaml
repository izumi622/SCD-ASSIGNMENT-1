# ── CI Pipeline — Lint, Typecheck, Test, Security & Smoke Tests ──
# Triggered on pull requests to main and on pushes to dev
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Backend & Frontend: Lint & Typecheck ─────────────
  lint-and-type:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend linters
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install ruff mypy

      - name: Backend Ruff check & format
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

  # ── Backend Tests (PostgreSQL + Redis service containers) ──
  test-backend:
    name: Backend Tests & Coverage (>= 65%)
    runs-on: ubuntu-latest
    needs: lint-and-type
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
      SYNC_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      TRIAGE_PROVIDER: simulated
      ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests with coverage
        working-directory: backend
        run: |
          pytest tests/ -v --cov=app --cov-fail-under=65 --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ── Frontend Vitest Suite & Production Build ─────────
  test-frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest component tests
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ── Kubernetes Manifest Validation (Kubeconform) ─────
  kubeconform:
    name: Kubeconform Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes Manifests
        run: |
          kubeconform -summary -strict -ignore-missing-schemas k8s/*.yaml

  # ── Security Scan (Trivy) ────────────────────────────
  trivy-scan:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t civicpulse-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t civicpulse-frontend:ci ./frontend

      - name: Run Trivy scanner on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: civicpulse-backend:ci
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Run Trivy scanner on frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: civicpulse-frontend:ci
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  # ── Docker Compose Integration Smoke Test ────────────
  compose-smoke:
    name: Compose Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [trivy-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cp .env.example .env

      - name: Start Compose stack
        run: |
          docker compose up -d --build postgres redis migrations backend frontend
          sleep 20

      - name: Smoke test API endpoints end-to-end
        run: |
          # 1. Probe checks
          curl --fail --retry 10 --retry-delay 3 http://localhost:8000/health
          curl --fail --retry 10 --retry-delay 3 http://localhost:8000/ready

          # 2. Intake submission (POST)
          RESPONSE=$(curl --fail -s -X POST http://localhost:8000/api/complaints \
            -H "Content-Type: application/json" \
            -d '{"text": "Severe water main burst flooding street 12 since morning", "location": "Street 12, Sector F-8"}')
          echo "Create response: $RESPONSE"

          # 3. Fetch the newly created complaint by its server-generated ID
          COMPLAINT_ID=$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl --fail --silent --show-error "http://localhost:8000/api/complaints/$COMPLAINT_ID" \
            | python3 -c 'import json,sys; complaint=json.load(sys.stdin); assert complaint["text"] == "Severe water main burst flooding street 12 since morning"; assert complaint["category"] == "water"'

          # 4. Verify read-through stats cache with real GET requests
          curl --fail --silent --show-error -D "$RUNNER_TEMP/stats-miss.headers" -o /dev/null http://localhost:8000/api/stats
          curl --fail --silent --show-error -D "$RUNNER_TEMP/stats-hit.headers" -o /dev/null http://localhost:8000/api/stats
          grep -qi '^x-cache: MISS' "$RUNNER_TEMP/stats-miss.headers"
          grep -qi '^x-cache: HIT' "$RUNNER_TEMP/stats-hit.headers"

          # 5. Check frontend HTTP 200
          curl --fail -s -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep -q "200"

      - name: Tear down Compose
        if: always()
        run: docker compose down -v
