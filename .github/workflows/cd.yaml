# ── CD Pipeline — Test, Build, Push (Commit SHA), Deploy to Cluster ──
# Triggered on push to main (after PR merge)
name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/izumi622/scd-assignment-1/backend
  FRONTEND_IMAGE: ghcr.io/izumi622/scd-assignment-1/frontend

jobs:
  # ── Gating Test Job: runs full test suite on merged main ────────
  test:
    name: Full Test Suite Gating
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
      SYNC_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      TRIAGE_PROVIDER: simulated
      ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies & test
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
          alembic upgrade head
          pytest tests/ -v --cov=app --cov-fail-under=65

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies & test
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm test
          npm run build

  # ── Build & Push: ONLY runs if test passes (needs: [test]) ──────
  build-push:
    name: Build & Push Images (Tagged by Commit SHA)
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}
      backend_digest: ${{ steps.backend_image.outputs.digest }}
      frontend_digest: ${{ steps.frontend_image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push tagged strictly by commit SHA (never latest for deployment)
      - name: Build & push backend image
        id: backend_image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        id: frontend_image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Generate SBOM with Syft
      - name: Generate Backend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha }}
          format: spdx-json
          output-file: backend-${{ steps.meta.outputs.sha }}.spdx.json

      - name: Generate Frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha }}
          format: spdx-json
          output-file: frontend-${{ steps.meta.outputs.sha }}.spdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: "*.spdx.json"

  # ── Deploy & Smoke Test: verifies rollout and asserts failure on error ──
  deploy-k8s:
    name: Deploy to Kind Cluster & Verify Rollout
    runs-on: ubuntu-latest
    needs: [build-push]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Kind Cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: civicpulse-ci
          node_image: kindest/node:v1.35.1

      - name: Install metrics server, VPA and Ingress
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.8.1/components.yaml
          kubectl patch deployment metrics-server -n kube-system --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          git clone --quiet --depth 1 --branch vertical-pod-autoscaler-1.7.1 \
            https://github.com/kubernetes/autoscaler.git /tmp/civicpulse-autoscaler
          (cd /tmp/civicpulse-autoscaler/vertical-pod-autoscaler && ./hack/vpa-up.sh)
          helm upgrade --install ingress-nginx ingress-nginx \
            --repo https://kubernetes.github.io/ingress-nginx \
            --version 4.15.1 --namespace ingress-nginx --create-namespace \
            --wait --timeout 5m

      - name: Log in to GHCR for private packages
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load SHA-tagged images into kind
        run: |
          docker pull "${BACKEND_IMAGE}:${{ needs.build-push.outputs.image_tag }}"
          docker pull "${FRONTEND_IMAGE}:${{ needs.build-push.outputs.image_tag }}"
          kind load docker-image "${BACKEND_IMAGE}:${{ needs.build-push.outputs.image_tag }}" \
            --name civicpulse-ci
          kind load docker-image "${FRONTEND_IMAGE}:${{ needs.build-push.outputs.image_tag }}" \
            --name civicpulse-ci

      - name: Inject ephemeral database credentials into the production overlay
        env:
          CIVICPULSE_POSTGRES_PASSWORD: ${{ secrets.CIVICPULSE_POSTGRES_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import secrets
          from pathlib import Path
          from urllib.parse import quote

          path = Path("k8s/base/secrets.yaml")
          content = path.read_text()
          password = os.environ.get("CIVICPULSE_POSTGRES_PASSWORD") or secrets.token_hex(16)
          encoded_password = quote(password, safe="")
          content = content.replace('POSTGRES_USER: "CHANGE_ME"', 'POSTGRES_USER: "civicpulse"')
          content = content.replace('POSTGRES_PASSWORD: "CHANGE_ME"', 'POSTGRES_PASSWORD: ' + json.dumps(password))
          content = content.replace('POSTGRES_DB: "CHANGE_ME"', 'POSTGRES_DB: "civicpulse_db"')
          content = content.replace("CHANGE_ME:CHANGE_ME@postgres-svc:5432/CHANGE_ME",
                                    f"civicpulse:{encoded_password}@postgres-svc:5432/civicpulse_db")
          if "CHANGE_ME" in content:
              raise RuntimeError("Unresolved database placeholder")
          path.write_text(content)
          PY

      - name: Deploy production overlay with immutable image tags
        run: |
          cat >> k8s/overlays/prod/kustomization.yaml <<EOF
          images:
            - name: ghcr.io/civicpulse/backend
              newName: ${BACKEND_IMAGE}
              newTag: ${{ needs.build-push.outputs.image_tag }}
            - name: ghcr.io/civicpulse/frontend
              newName: ${FRONTEND_IMAGE}
              newTag: ${{ needs.build-push.outputs.image_tag }}
          EOF
          kubectl apply -k k8s/overlays/prod
          kubectl wait --for=condition=complete job/migrations -n civicpulse --timeout=300s

      - name: Await backend and frontend rollout
        run: |
          kubectl rollout status deployment/backend -n civicpulse --timeout=300s
          kubectl rollout status deployment/frontend -n civicpulse --timeout=300s

      - name: Smoke test via the Ingress controller
        run: |
          kubectl port-forward -n ingress-nginx svc/ingress-nginx-controller \
            18080:80 > /tmp/civicpulse-ingress.log 2>&1 &
          curl --fail --silent --show-error --retry 20 --retry-delay 2 \
            --retry-connrefused -H 'Host: civicpulse.local' \
            http://127.0.0.1:18080/ready
          curl --fail --silent --show-error -o /dev/null \
            -H 'Host: civicpulse.local' http://127.0.0.1:18080/
          response=$(curl --fail --silent --show-error -X POST \
            -H 'Host: civicpulse.local' -H 'Content-Type: application/json' \
            --data '{"text":"Water main burst flooding houses since morning","location":"Street 12, Islamabad"}' \
            http://127.0.0.1:18080/api/complaints)
          complaint_id=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl --fail --silent --show-error -H 'Host: civicpulse.local' \
            "http://127.0.0.1:18080/api/complaints/$complaint_id" \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["category"] == "water"'

      - name: Print autoscaling status
        run: |
          kubectl get pods -n civicpulse -o wide
          kubectl get svc -n civicpulse
          kubectl get hpa -n civicpulse
          kubectl get vpa -n civicpulse
