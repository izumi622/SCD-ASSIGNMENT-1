# ── CD Pipeline — Test, Build, Push (Commit SHA), Deploy to Cluster ──
# Triggered on push to main (after PR merge)
name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ── Gating Test Job: runs full test suite on merged main ────────
  test:
    name: Full Test Suite Gating
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
      SYNC_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      TRIAGE_PROVIDER: simulated
      ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies & test
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
          alembic upgrade head
          pytest tests/ -v --cov=app --cov-fail-under=65

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies & test
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build

  # ── Build & Push: ONLY runs if test passes (needs: [test]) ──────
  build-push:
    name: Build & Push Images (Tagged by Commit SHA)
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push tagged strictly by commit SHA (never latest for deployment)
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Generate SBOM with Syft
      - name: Generate Backend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha }}
          format: spdx-json
          output-file: backend-${{ steps.meta.outputs.sha }}.spdx.json

      - name: Generate Frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha }}
          format: spdx-json
          output-file: frontend-${{ steps.meta.outputs.sha }}.spdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: "*.spdx.json"

  # ── Deploy & Smoke Test: verifies rollout and asserts failure on error ──
  deploy-k8s:
    name: Deploy to Kind Cluster & Verify Rollout
    runs-on: ubuntu-latest
    needs: [build-push]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Kind Cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: civicpulse-ci

      - name: Deploy Kubernetes Manifests via Kustomize
        run: |
          # Apply production overlay with the exact commit SHA tag
          cd k8s/overlays/prod
          kustomize edit set image ghcr.io/civicpulse/backend=${{ env.BACKEND_IMAGE }}:${{ needs.build-push.outputs.image_tag }}
          kustomize edit set image ghcr.io/civicpulse/frontend=${{ env.FRONTEND_IMAGE }}:${{ needs.build-push.outputs.image_tag }}
          cd ../../..

          kubectl apply -k k8s/overlays/prod

      - name: Await Rollout (Fails job if deployment times out or crashes)
        run: |
          # Strict rollout check: exits with non-zero code on failure (no swallowing with || true)
          kubectl rollout status deployment/backend -n civicpulse --timeout=180s
          kubectl rollout status deployment/frontend -n civicpulse --timeout=180s

      - name: Verify Cluster Health & HPA
        run: |
          kubectl get pods -n civicpulse -o wide
          kubectl get svc -n civicpulse
          kubectl get hpa -n civicpulse
